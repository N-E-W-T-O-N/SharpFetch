name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Native AOT binaries. Grouped by host OS because Native AOT cannot
  # cross-compile between operating systems; cross-arch within one OS is fine.
  native:
    name: Publish-${{ matrix.rid }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
          - rid: win-arm64
            runs-on: windows-latest
          - rid: linux-x64
            runs-on: ubuntu-22.04
          - rid: linux-arm64
            runs-on: ubuntu-22.04-arm
          - rid: osx-x64
            runs-on: macos-15-intel
          - rid: osx-arm64
            runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: publish Native AOT
        run: >
          dotnet publish src/SharpFetch.Cli/SharpFetch.Cli.csproj
          -c Release -f net10.0 -r ${{ matrix.rid }}
          -p:PublishAot=true -p:PackAsTool=false
          -p:StripSymbols=true -p:InvariantGlobalization=true
          -o publish/${{ matrix.rid }}

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharpfetch-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/SharpFetch.Cli
            publish/${{ matrix.rid }}/SharpFetch.Cli.exe

  # Alpine/musl needs an Alpine host for its AOT toolchain.
  native-musl:
    name: Publish-linux-musl-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            alpine-arch: x86_64
            apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static#!sha256!34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
            runs-on: ubuntu-22.04
          - arch: arm64
            alpine-arch: aarch64
            apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/aarch64/apk.static#!sha256!e471d35aa221d031abe9b6288aede12a8e9f1a398954e5a2e1d1bce1727b4ef4
            runs-on: ubuntu-22.04-arm
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup Alpine
        uses: jirutka/setup-alpine@6c81335ebff01869c49c73f03d8753d6b61c5a12 # v1.4.1
        with:
          # dotnet10-sdk only exists on Alpine's edge branch - no stable
          # release (v3.21 included) packages it yet.
          branch: edge
          # arch (QEMU target) and apk-tools-url (bootstrap apk.static binary)
          # both default to x86_64 independent of the actual host, so the
          # native arm64 runner tried to execute an x86_64 binary without
          # QEMU set up for it. ubuntu-22.04-arm is genuinely aarch64
          # hardware - no emulation needed, point both at the real arch.
          arch: ${{ matrix.alpine-arch }}
          apk-tools-url: ${{ matrix.apk-tools-url }}
          packages: dotnet10-sdk bash build-base clang lld zlib-dev icu-libs krb5-libs libgcc libintl libssl3 libstdc++

      - name: publish Native AOT (musl)
        shell: alpine.sh {0}
        run: |
          dotnet publish src/SharpFetch.Cli/SharpFetch.Cli.csproj \
            -c Release -f net10.0 -r linux-musl-${{ matrix.arch }} \
            -p:PublishAot=true -p:PackAsTool=false \
            -p:StripSymbols=true -p:InvariantGlobalization=true \
            -o publish/linux-musl-${{ matrix.arch }}

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharpfetch-linux-musl-${{ matrix.arch }}
          path: publish/linux-musl-${{ matrix.arch }}/SharpFetch.Cli

  # armv7 (32-bit ARM) has runtime packs but no Native AOT support, so it ships
  # as a self-contained ReadyToRun build instead.
  native-armv7:
    name: Publish-linux-arm
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: publish self-contained ReadyToRun
        run: >
          dotnet publish src/SharpFetch.Cli/SharpFetch.Cli.csproj
          -c Release -f net10.0 -r linux-arm
          --self-contained -p:PublishReadyToRun=true -p:PackAsTool=false
          -o publish/linux-arm

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharpfetch-linux-arm
          path: publish/linux-arm/SharpFetch.Cli

  # Portable framework-dependent build. This is the only route for platforms
  # with a valid RID but no Microsoft-published runtime pack (FreeBSD, riscv64,
  # loongarch64, s390x, ppc64le) - they run it on a community-built runtime.
  portable:
    name: Publish-portable
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: publish framework-dependent
        run: >
          dotnet publish src/SharpFetch.Cli/SharpFetch.Cli.csproj
          -c Release -f net10.0 --no-self-contained -p:PackAsTool=false
          -o publish/portable

      - name: pack dotnet tool
        run: dotnet pack src/SharpFetch.Cli/SharpFetch.Cli.csproj -c Release -o publish/nupkg

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharpfetch-portable
          path: |
            publish/portable
            publish/nupkg/*.nupkg

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, native-musl, native-armv7, portable]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: package per-target archives
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp README.md LICENSE "$dir"
            if [[ "$name" == *-win-* ]]; then
              (cd "$dir" && zip -qr "../../dist/$name.zip" .)
            else
              tar -czf "dist/$name.tar.gz" -C "$dir" .
            fi
          done
          ls -l dist

      - name: create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: dist/*
          generateReleaseNotes: true
          allowUpdates: true
